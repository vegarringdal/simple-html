# Tags a release, by hand: the Actions tab, "tag", "Run workflow". Reads the version from package.json
# (set by hand, a final version like 6.1.0) and pushes the git tag v<version> on the commit it runs on -
# only the tag is pushed, never a commit. Only from the default branch (master); stops when the tag is
# there already. Publishing the package is publish.yml, run by hand as well.
#
# A pull request to master runs it too (pr.yml), with dry_run: the same steps from any branch, nothing
# pushed, and "tagged already" a warning - a release that would fail fails there.
#
# GitHub shows "Run workflow" for a workflow that is on the default branch: this file has to be on it.
name: tag

on:
    workflow_dispatch:
    workflow_call:
        inputs:
            dry_run:
                type: boolean
                default: false

permissions:
    # the tag
    contents: write

# a dry run waits for none
concurrency:
    group: ${{ inputs.dry_run && format('tag-dry-run-{0}', github.run_id) || 'tag' }}
    cancel-in-progress: false

jobs:
    tag:
        runs-on: ubuntu-latest
        env:
            DRY_RUN: ${{ inputs.dry_run == true }}
        steps:
            - name: only from the default branch
              if: env.DRY_RUN != 'true'
              env:
                  BRANCH: ${{ github.ref_name }}
                  DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
              run: |
                  if [ "$BRANCH" != "$DEFAULT_BRANCH" ]; then
                      echo "::error::a release is tagged on $DEFAULT_BRANCH only, not on $BRANCH"
                      exit 1
                  fi

            - uses: actions/checkout@v7

            - id: version
              run: |
                  version=$(node -p "require('./package.json').version")
                  if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
                      echo "::error::the version in package.json must be a final version like 6.1.0, not $version"
                      exit 1
                  fi
                  echo "version=$version" >> "$GITHUB_OUTPUT"

            - name: tag it
              env:
                  VERSION: ${{ steps.version.outputs.version }}
              run: |
                  if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" > /dev/null; then
                      if [ "$DRY_RUN" = "true" ]; then
                          echo "::warning::v$VERSION is tagged already - change the version in package.json before the release"
                          exit 0
                      fi
                      echo "::error::v$VERSION is tagged already - change the version in package.json"
                      exit 1
                  fi
                  git tag "v$VERSION"
                  if [ "$DRY_RUN" = "true" ]; then
                      echo "Dry run: tag would tag $GITHUB_SHA as v$VERSION" >> "$GITHUB_STEP_SUMMARY"
                      exit 0
                  fi
                  git push origin "refs/tags/v$VERSION"
                  echo "Tagged $GITHUB_SHA as v$VERSION" >> "$GITHUB_STEP_SUMMARY"
