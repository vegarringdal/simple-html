# Builds the samples app and publishes it to the gh-pages branch on every push to v6_maybe,
# so the branch can be tried in a browser. GitHub Pages serves the gh-pages branch at
# https://<owner>.github.io/<repo>/ once Settings -> Pages -> Source is set to that branch.
name: demo

on:
    push:
        branches: [v6_maybe]
    # run it by hand from the Actions tab
    workflow_dispatch:

# the last step pushes to the gh-pages branch
permissions:
    contents: write

# a newer push replaces a deploy that is still running
concurrency:
    group: demo
    cancel-in-progress: true

jobs:
    demo:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: npm

            - run: npm ci

            - run: npm run build:demo

            # gh-pages only ever holds the latest build: a fresh one commit history, force pushed
            - name: push dist_demo to gh-pages
              working-directory: dist_demo
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  git init -q -b gh-pages
                  git add -A
                  git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -q -m "demo from ${GITHUB_SHA}"
                  git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
