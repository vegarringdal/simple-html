# A pull request to master: the release workflows, tag.yml and publish.yml, as a dry run - their own
# steps in their order, nothing tagged or published. A release that would fail once it is merged fails
# here. "Tagged already" and "published already" are warnings: a pull request need not bump the version.
name: release dry run

on:
    pull_request:
        branches: [master]

permissions:
    contents: read

jobs:
    tag:
        # what tag.yml asks for; nothing is pushed in a dry run (a fork's pull request gets read only)
        permissions:
            contents: write
        uses: ./.github/workflows/tag.yml
        with:
            dry_run: true

    publish:
        permissions:
            contents: read
            packages: write
        uses: ./.github/workflows/publish.yml
        with:
            dry_run: true
