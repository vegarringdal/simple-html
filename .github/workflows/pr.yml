# A pull request to master: its title must be a conventional commit, so master's history says what each
# change is. Fails until the title is one of
#   fix: ...   feat: ...   fix!: ...   feat!: ...   (! - something breaks)
#   chore: ... docs: ... test: ... refactor: ... ci: ... build: ... perf: ... style: ...
# (a scope is fine: feat(grid): ...). Renaming the pull request runs it again. The tests are checks.yml.
# The version is not made from it: package.json has it, see publish.yml.
# See scripts/prTitle.js.
name: pull request

on:
    pull_request:
        branches: [master]
        types: [opened, edited, synchronize, reopened]

permissions:
    contents: read

jobs:
    title:
        name: title
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7

            - run: node scripts/prTitle.js
              env:
                  TITLE: ${{ github.event.pull_request.title }}
